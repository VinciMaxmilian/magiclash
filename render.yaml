# Render Blueprint: ONE web service running the API (FastAPI) and the realtime game server
# (Node, WebSocket) in the same Docker container — see Dockerfile and docs/DEPLOY.md.
# The frontend stays on Netlify; database/auth/storage on Supabase.
#
# `sync: false` values are asked for in the Render dashboard (never commit them).
# Free plan: sleeps after ~15 min without traffic (first request then takes ~1 min).
# There is no South America region; virginia is the closest to Brazil and to Supabase sa-east-1.

services:
  - type: web
    name: magiclash
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Signs join tokens (API → game server) and match results (game server → API).
      - key: GAME_SERVER_SECRET
        generateValue: true
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: REGION
        value: virginia
      - key: ALLOWED_ORIGINS # https://<site>.netlify.app (used by both the API and the game server)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REALTIME_URL # wss://<this service host>/ws
        sync: false
