# Render Blueprint: API (FastAPI) + realtime game server (Node, WebSocket). docs/DEPLOY.md.
# The frontend stays on Netlify; database/auth/storage on Supabase.
#
# Values marked `sync: false` are asked for in the Render dashboard when the Blueprint is created
# (never commit them). GAME_SERVER_SECRET and GUEST_TOKEN_SECRET are generated by Render.
# Free plan: services sleep after ~15 min without traffic (first request then takes ~1 min).
# There is no South America region; virginia is the closest to Brazil and to Supabase sa-east-1.

envVarGroups:
  - name: magiclash-shared
    envVars:
      # Signs join tokens (API → game server) and match results (game server → API).
      - key: GAME_SERVER_SECRET
        generateValue: true

services:
  - type: web
    name: magiclash-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: magiclash-shared
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENV
        value: production
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS # https://<site>.netlify.app
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REALTIME_URL # wss://<magiclash-realtime host>/ws
        sync: false

  - type: web
    name: magiclash-realtime
    runtime: node
    plan: free
    region: virginia
    # NODE_ENV=production is also set at build time, so dev dependencies (esbuild) must be asked for.
    buildCommand: npm ci --include=dev && npm run build -w @magiclash/realtime
    startCommand: node realtime/dist/server.js
    healthCheckPath: /health
    envVars:
      - fromGroup: magiclash-shared
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: REGION
        value: virginia
      - key: API_URL # https://<magiclash-api host>
        sync: false
      - key: ALLOWED_ORIGINS # https://<site>.netlify.app
        sync: false
